<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">My<span>Profile</span></a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="hobbies.html">Hobbies</a>
            <a href="skills.html">Skills</a>
            <a href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
            <a class="active" href="economicform.html">Shopping Calculator</a>
        </nav>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">Dark mode</button>
    </header>

    <main class="page-main">
        <section class="calculator">
            <h1>Shopping Calculator</h1>
                <p>Calculate how much you will spend when shopping online.</p>

        <form id="shoppingForm">
            <label for="itemPrice">Item Price (Rp):</label>
            <input type="number" id="itemPrice" min="0" step="any" placeholder="e.g. 50000" required>
            
            <label for="quantity">Quantity:</label>
            <input type="number" id="quantity" min="1" step="1" value="1" required>

            <label for="shipping">Shipping Fee (Rp):</label>
            <input type="number" id="shipping" min="0" step="any" value="0" required>

            <label for="discount">Discount (%):</label>
            <input type="number" id="discount" min="0" max="100" step="any" value="0" required>

            <button type="submit">Calculate Total</button>
            <button type="reset">Reset</button>
        </form>

        <div class="calculator-result" aria-live="polite">
            <h2>Purchase Summary</h2>
            <p>Subtotal: <span id="subtotal">Rp0</span></p>
            <p>Discount: <span id="discountAmount">Rp0</span></p>
            <p>Shipping: <span id="shippingCost">Rp0</span></p>
            <h3>Final Total: <span id="finalTotal">Rp0</span></h3>
        </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
